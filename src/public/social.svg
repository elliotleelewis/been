<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
	<!-- The picture a link to the site is previewed with: the icon's globe, drawn as an orthographic
		graticule every 30°, with a scatter of its cells filled in, as a map being ticked off. It has
		no words, as the preview's title and description sit beside it. Each cell is the strip
		between two meridians' ellipses, cut to the band between two parallels by a nested viewport.
		The globe has a radius of 230 about (600, 315): the meridians 30° and 60° from the middle
		are ellipses 115 and 199 wide, and the parallels 30° and 60° from the equator lie 115 and 199
		from it. -->
	<defs>
		<ellipse id="strip-0" cx="600" cy="315" rx="115" ry="230" />
		<path
			id="strip-1"
			fill-rule="evenodd"
			d="M401 315a199 230 0 1 0 398 0a199 230 0 1 0-398 0ZM485 315a115 230 0 1 0 230 0a115 230 0 1 0-230 0Z"
		/>
		<path
			id="strip-2"
			fill-rule="evenodd"
			d="M370 315a230 230 0 1 0 460 0a230 230 0 1 0-460 0ZM401 315a199 230 0 1 0 398 0a199 230 0 1 0-398 0Z"
		/>
	</defs>
	<rect width="1200" height="630" fill="#ff6c00" />
	<g fill="#fff">
		<svg x="600" y="200" width="230" height="115" viewBox="600 200 230 115">
			<use href="#strip-0" />
		</svg>
		<svg x="600" y="200" width="230" height="115" viewBox="600 200 230 115">
			<use href="#strip-1" />
		</svg>
		<svg x="370" y="315" width="230" height="115" viewBox="370 315 230 115">
			<use href="#strip-1" />
		</svg>
		<svg x="600" y="430" width="230" height="84" viewBox="600 430 230 84">
			<use href="#strip-0" />
		</svg>
	</g>
	<!-- A few more, half filled, as the passport's stamps ink a country in as they land. -->
	<g fill="#fff" fill-opacity="0.45">
		<svg x="600" y="116" width="230" height="84" viewBox="600 116 230 84">
			<use href="#strip-0" />
		</svg>
		<svg x="370" y="200" width="230" height="115" viewBox="370 200 230 115">
			<use href="#strip-2" />
		</svg>
		<svg x="600" y="315" width="230" height="115" viewBox="600 315 230 115">
			<use href="#strip-2" />
		</svg>
	</g>
	<g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round">
		<circle cx="600" cy="315" r="230" />
		<ellipse cx="600" cy="315" rx="115" ry="230" />
		<ellipse cx="600" cy="315" rx="199" ry="230" />
		<path d="M600 85v460M370 315h460M401 200h398M401 430h398M485 116h230M485 514h230" />
	</g>
</svg>
