<!doctype html>
<!-- Served by Cloudflare Pages, with a 404 status, for any path the site has no file at. Its being
	here also turns off Pages' single-page-app fallback, which would otherwise answer every such path
	with the map's page and a 200, and so pass off HTML as robots.txt, llms.txt or an ARD manifest to
	anything that asks for one. A reader who lands here is sent on to the map, as the app's own
	not-found route does. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Not found · Been</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta http-equiv="refresh" content="0; url=/" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
	</head>
	<body>
		<p>There is no page here. <a href="/">Go to the map.</a></p>
	</body>
</html>
